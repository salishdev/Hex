name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Generate Xcode project
        run: bash scripts/generate-project.sh
      - name: HexCore tests
        working-directory: HexCore
        run: swift test
      - name: App tests
        run: >-
          xcodebuild test -project Hex.xcodeproj -scheme Hex -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/DerivedData
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM=
          -resultBundlePath build/HexTests.xcresult
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/HexTests.xcresult
          if-no-files-found: ignore
